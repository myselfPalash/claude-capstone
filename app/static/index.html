<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do List</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>To-Do List</h1>

    <form id="add-form" class="add-form" autocomplete="off">
      <label for="new-task" class="visually-hidden">New task description</label>
      <input type="text" id="new-task" name="description" maxlength="255" required placeholder="What needs to be done?">
      <button type="submit">Add task</button>
    </form>

    <p id="error-message" class="error" role="alert" hidden></p>

    <section aria-labelledby="list-heading">
      <h2 id="list-heading" class="visually-hidden">Tasks</h2>
      <p id="empty-message" class="empty" hidden>No tasks yet. Add one above.</p>
      <ul id="task-list" class="task-list"></ul>
    </section>
  </main>
</body>
</html>
